<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParceLock MVP Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ParceLock "Bay Colors" theme. Tokens and rules: see DESIGN.md */
:root{
  /* type */
  --f-display:"Bricolage Grotesque","Avenir Next",sans-serif;
  --f-body:"Figtree","Avenir Next","Helvetica Neue",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* neutrals */
  --bg:oklch(0.962 0.006 120);
  --card:oklch(0.997 0.002 120);
  --surface-2:oklch(0.94 0.008 130);
  --ink:oklch(0.26 0.02 165);
  --muted:oklch(0.5 0.016 165);
  --line:oklch(0.89 0.01 140);
  /* primary: deep green */
  --pri:oklch(0.42 0.085 165); --pri-hover:oklch(0.36 0.08 165);
  --pri-2:var(--pri); --pri-bg:oklch(0.93 0.035 165);
  /* semantic (names used by templates) */
  --amber:oklch(0.52 0.12 65);  --amber-bg:oklch(0.95 0.045 85);
  --red:oklch(0.53 0.19 27);    --red-bg:oklch(0.95 0.03 25);
  --green:oklch(0.48 0.11 155); --green-bg:oklch(0.95 0.04 155);
  /* door: soft green-charcoal kiosk */
  --door:oklch(0.26 0.02 175); --door-2:oklch(0.31 0.02 175); --door-well:oklch(0.225 0.018 175);
  --door-line:oklch(0.39 0.02 175); --door-ink:oklch(0.96 0.006 120); --door-muted:oklch(0.78 0.015 160);
  --door-red:oklch(0.8 0.11 25); --door-green:oklch(0.84 0.11 160);
  /* shape + motion */
  --r:14px; --pill:999px;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --dur:150ms;
  /* neutral bay fallback */
  --bay:var(--muted); --bay-fill:var(--surface-2); --bay-ink:var(--ink);
}
/* the four bay colors: one hue per bay, used everywhere that bay appears */
[data-bay="A"]{--bay:oklch(0.74 0.14 48);  --bay-fill:oklch(0.92 0.055 50);  --bay-ink:oklch(0.43 0.11 45)}
[data-bay="B"]{--bay:oklch(0.72 0.12 238); --bay-fill:oklch(0.92 0.045 235); --bay-ink:oklch(0.42 0.1 245)}
[data-bay="C"]{--bay:oklch(0.76 0.13 165); --bay-fill:oklch(0.92 0.055 165); --bay-ink:oklch(0.41 0.08 165)}
[data-bay="D"]{--bay:oklch(0.86 0.14 95);  --bay-fill:oklch(0.95 0.08 97);   --bay-ink:oklch(0.45 0.09 85)}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
a{color:var(--pri);text-underline-offset:2px}
input[type=checkbox]{accent-color:var(--pri);width:16px;height:16px}
:where(a,button,input,select,[tabindex]):focus-visible{outline:2.5px solid var(--pri);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.95em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hide{display:none!important}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.015em}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand .logo{width:30px;height:30px;border-radius:10px;background:var(--pri);display:grid;place-items:center}
.tag{font-size:11.5px;font-weight:600;color:var(--pri);background:var(--pri-bg);padding:2px 9px;border-radius:var(--pill);white-space:nowrap}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav a{padding:7px 14px;border-radius:var(--pill);color:var(--muted);text-decoration:none;font-weight:600;transition:background-color var(--dur) var(--ease-out),color var(--dur) var(--ease-out)}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--pri-bg);color:var(--pri)}
main{max-width:1280px;margin:0 auto;padding:28px 20px 48px}

/* generic */
.card{background:var(--card);border-radius:var(--r);padding:18px}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:var(--pill);font-weight:650;line-height:1.3;transition:background-color var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out),transform var(--dur) var(--ease-out)}
.btn:hover{border-color:oklch(0.78 0.015 150);background:oklch(0.985 0.004 130)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--card)}
.btn.pri:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--card)}
.btn.danger:hover{background:oklch(0.47 0.18 27)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pri)}
.btn.ghost:hover{background:var(--pri-bg)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.lg{padding:13px 22px;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--pill);padding:4px 11px;font-size:12.5px;margin:0 6px 6px 0;transition:background-color var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out)}
.chip:hover{background:var(--pri-bg);border-color:var(--pri);color:var(--pri)}
.badge{display:inline-block;font-size:11.5px;font-weight:650;padding:1px 9px;border-radius:var(--pill);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.cod{background:var(--amber-bg);color:var(--amber)}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.bad{background:var(--red-bg);color:var(--red)}
.badge.pri{background:var(--pri-bg);color:var(--pri)}
.badge.pri[data-bay]{background:var(--bay-fill);color:var(--bay-ink);padding-left:5px}
.badge.pri[data-bay]::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bay);margin-right:5px;vertical-align:0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.field input,.field select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);transition:border-color var(--dur) var(--ease-out)}
.field input:hover,.field select:hover{border-color:oklch(0.8 0.015 150)}
.field input:focus,.field select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.demo-note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.demo-note b{font-size:11px;font-weight:700;color:var(--ink);background:var(--surface-2);padding:1px 7px;border-radius:var(--pill);margin-right:2px}

/* overview */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:stretch}
.hero>.card:first-child{padding:32px!important}
.hero .tag{background:none;padding:0;color:var(--muted);font-size:13px}
.hero h1{font-size:40px;line-height:1.08;letter-spacing:-.025em;margin-bottom:14px;max-width:22ch}
.hero p{max-width:60ch;line-height:1.65;font-size:16px!important}
.hero .card>h3:first-child{font-size:19px!important;margin-bottom:6px}
.hero li{margin-bottom:6px}
.hero li::marker,.flow li::marker{color:var(--pri);font-weight:700}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.role{display:block;text-decoration:none;color:inherit;border-radius:var(--r)}
.role .card{height:100%;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;transition:background-color var(--dur) var(--ease-out),transform var(--dur) var(--ease-out)}
.role .card .small{grid-column:1/-1;margin-top:8px}
.role:hover .card{background:var(--pri-bg)}
.role:active .card{transform:scale(.99)}
.role h3{font-size:17px;margin:0}
.ico{width:38px;height:38px;border-radius:50%;background:var(--pri-bg);color:var(--pri);display:grid;place-items:center}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.flow .card>b:first-child,.scope .card>b:first-child{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.flow ol{margin:6px 0 0;padding-left:20px}
.flow li{margin-bottom:5px}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.scope ul{margin:6px 0 0;padding-left:18px}
.scope li{margin-bottom:4px}
.scope li::marker{color:var(--pri)}

/* phone */
.phone{width:380px;max-width:100%;height:760px;background:var(--card);border:10px solid oklch(0.24 0.015 165);border-radius:46px;overflow:hidden;display:flex;flex-direction:column;margin:0 auto}
.ph-top{padding:16px 18px 12px;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
.ph-top b{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em}
.ph-top .row{justify-content:space-between}
.ph-top select{background:var(--surface-2);color:var(--ink);border:0;border-radius:var(--pill);padding:6px 10px;font-weight:650}
.ph-top select option{color:#000}
.ph-top .small{color:var(--muted);opacity:1!important}
.ph-body{flex:1;overflow:auto;padding:14px 14px 18px;background:var(--bg)}
.ph-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--card)}
.ph-tabs button{border:0;background:none;padding:8px 0 10px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.ph-tabs button svg{box-sizing:content-box;padding:3px 14px;border-radius:var(--pill);transition:background-color var(--dur) var(--ease-out)}
.ph-tabs button.on{color:var(--pri)}
.ph-tabs button.on svg{background:var(--pri-bg)}
.ph-tabs button:focus-visible{outline-offset:-4px;border-radius:12px}
.ph-sec{font-size:13px;font-weight:700;color:var(--ink);margin:18px 2px 8px}
.pcard{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.pcard .t{font-weight:650}
.ready{background:var(--pri);color:var(--card);border-radius:18px;padding:16px;display:flex;align-items:center;gap:12px}
.ready>.grow>div:last-child{font-family:var(--f-display);font-size:24px!important;font-weight:700!important;letter-spacing:-.02em}
.ready .btn{background:var(--card);color:var(--pri);border-color:var(--card)}
.ready .btn:hover{background:var(--pri-bg)}
.qrbox{background:var(--card);border-radius:18px;padding:18px;text-align:center}
.qrbox svg{width:210px;height:210px}
.code{font-family:var(--f-mono);font-size:30px;letter-spacing:.12em;font-weight:600}
.wallet-bal{font-family:var(--f-display);font-size:38px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.notif{font-size:12.5px;padding:9px 12px 9px 30px;background:var(--card);border-radius:12px;margin-bottom:6px;position:relative}
.notif::before{content:"";position:absolute;left:12px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--pri)}
.notif.warn::before{background:var(--amber)}
.notif.bad::before{background:var(--red)}
.msg{padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:10px}
.msg.ok{background:var(--green-bg);color:var(--green)}
.msg.bad{background:var(--red-bg);color:var(--red)}
.msg.warn{background:var(--amber-bg);color:var(--amber)}
.msg .btn{margin-top:6px}
.switch{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:12px}

/* door: soft green-charcoal kiosk */
.door{background:var(--door);color:var(--door-ink);border-radius:20px;padding:0;overflow:hidden}
.door a{color:var(--door-green)}
.door a[style]{color:var(--door-green)!important}
.door :focus-visible{outline-color:var(--door-ink)}
.door-bar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--door-well);font-size:13px}
.door-bar b{font-weight:650}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 11px;border-radius:var(--pill)}
.lock.locked{background:oklch(0.35 0.06 25);color:var(--door-red)}
.lock.open{background:oklch(0.35 0.05 160);color:var(--door-green)}
.door-grid{display:grid;grid-template-columns:1.35fr 1fr;min-height:470px}
.door-main{padding:24px}
.door-side{padding:20px;background:var(--door-2)}
.door h2{font-size:26px;margin-bottom:6px}
.door .muted{color:var(--door-muted)}
.door .field label{color:var(--door-muted)}
.door .field input{background:var(--door-well);border-color:var(--door-line);color:var(--door-ink)}
.door .field input:focus{border-color:var(--door-ink);box-shadow:0 0 0 3px oklch(1 0 0 / .12)}
.door .btn{background:var(--door-2);border-color:var(--door-line);color:var(--door-ink)}
.door .btn:hover{background:oklch(0.35 0.02 175);border-color:var(--door-muted)}
.door .btn.pri{background:var(--door-ink);border-color:var(--door-ink);color:var(--door)}
.door .btn.pri:hover{background:oklch(0.88 0.01 140);border-color:oklch(0.88 0.01 140)}
.door .btn.danger{background:oklch(0.6 0.19 27);border-color:oklch(0.6 0.19 27);color:#fff}
.door .btn.ghost{background:transparent;border-color:transparent;color:var(--door-muted)}
.door .btn.ghost:hover{color:var(--door-ink);background:oklch(1 0 0 / .06)}
.door .chip{background:var(--door-2);color:var(--door-ink);border-color:var(--door-line)}
.door .chip:hover{background:oklch(0.35 0.02 175);border-color:var(--door-muted);color:var(--door-ink)}
.door .demo-note{border-color:var(--door-line);color:var(--door-muted)}
.door .demo-note b{background:var(--door-2);color:var(--door-ink)}
.door .badge{background:oklch(1 0 0 / .08);color:var(--door-muted)}
.door .badge.ok{background:oklch(0.35 0.05 160);color:var(--door-green)}
.door .badge.bad{background:oklch(0.35 0.06 25);color:var(--door-red)}
.door .badge.cod{background:oklch(0.36 0.05 85);color:oklch(0.88 0.1 90)}
.big-choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.big-choice button{background:var(--door-2);border:1.5px solid transparent;color:var(--door-ink);border-radius:18px;padding:24px 20px;text-align:left;transition:background-color var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out)}
.big-choice button:hover{background:oklch(0.34 0.022 175);border-color:var(--door-line)}
.big-choice b{display:block;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.015em;margin:10px 0 4px}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 11px;border-radius:var(--pill);background:oklch(1 0 0 / .07);color:var(--door-muted);font-weight:600}
.steps span.on{background:var(--door-ink);color:var(--door)}
.steps span.done{background:oklch(0.35 0.05 160);color:var(--door-green)}
.steps span.done::before{content:"✓ "}
.bigbay{width:112px;height:112px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1;background:var(--bay);color:oklch(0.24 0.03 175);box-shadow:0 0 0 8px oklch(1 0 0 / .06)}
.dmsg{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px}
.dmsg.bad{background:oklch(0.34 0.07 25);color:oklch(0.93 0.04 25)}
.dmsg.ok{background:oklch(0.34 0.05 160);color:oklch(0.93 0.05 160)}
.dmsg.warn{background:oklch(0.36 0.05 85);color:oklch(0.94 0.07 90)}
.ditem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;margin-bottom:8px;background:var(--door-well)}
.ditem .bl{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:21px;font-weight:800;background:var(--door-2);color:var(--door-muted)}
.ditem .bl.on{background:var(--bay);color:oklch(0.24 0.03 175);box-shadow:0 0 16px color-mix(in oklch,var(--bay) 55%,transparent)}
.ditem.done{opacity:.55}
.link{background:none;border:0;color:var(--door-green);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;padding:0}
.bays{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bay{border-radius:16px;padding:12px 14px;background:var(--door-well);position:relative;overflow:hidden;border:1.5px solid transparent}
.bay .led{height:6px;border-radius:var(--pill);background:color-mix(in oklch,var(--bay) 22%,transparent);margin-bottom:10px}
.bay .nm{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1;color:var(--bay)}
.bay.on{border-color:var(--bay)}
.bay.on .led{background:var(--bay);box-shadow:0 0 14px 1px color-mix(in oklch,var(--bay) 70%,transparent);animation:pulse 1.2s ease-in-out infinite}
.bay.alarm{border-color:oklch(0.66 0.2 27)}
.bay.alarm .led{background:oklch(0.66 0.2 27);box-shadow:0 0 14px 1px oklch(0.66 0.2 27 / .7);animation:pulse .6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.bay .ld{font-size:12px;color:var(--door-muted)}
.pod{background:var(--card);color:var(--ink);border-radius:16px;padding:16px 18px;margin-top:8px}
.pod table{width:100%;border-collapse:collapse;font-size:12.5px}
.pod td,.pod th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}

/* office */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px}
.kpi .n{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);margin-top:2px}
.ogrid{display:grid;grid-template-columns:1fr 1.6fr;gap:16px;margin-bottom:16px}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--red-bg)}
.alert>.row>b{color:var(--red)}
.alert.info{background:var(--amber-bg)}
.alert.info>.row>b{color:var(--amber)}
.alert.res{background:var(--surface-2);opacity:.75}
.alert.res>.row>b{color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;font-weight:650;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t td[data-bay]:not([data-bay=""])::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bay);margin-right:6px;vertical-align:-1px}
.obays{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.obay{border-radius:12px;padding:12px;background:var(--bay-fill)}
.obay .nm{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--bay-ink)}
.obay .badge{background:oklch(1 0 0 / .65);color:var(--bay-ink)}
.obay .muted{color:var(--bay-ink);opacity:.8}
.scroll{max-height:380px;overflow:auto}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.sec-h h3{font-size:18px}
.view-pad>.sec-h h2{font-size:30px!important;letter-spacing:-.025em}
.mini-alerts{margin-top:16px}

/* demo split */
.split{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
.split-label{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 10px 4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:var(--pill);font-size:13.5px;font-weight:500;z-index:50}

@media (max-width:1000px){
  .hero,.flow,.scope,.ogrid,.split{grid-template-columns:1fr}
  .roles{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpis>.kpi:last-child{grid-column:1/-1}
  .door-grid{grid-template-columns:1fr}
  .obays{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){
  main{padding:0}
  .phone{border:0;border-radius:0;height:auto;min-height:calc(100vh - 140px);width:100%;box-shadow:none;overflow:visible}
  .ph-body{overflow:visible;padding-bottom:84px}
  .ph-tabs{position:fixed;left:0;right:0;bottom:0;z-index:30}
  .roles{grid-template-columns:1fr}
  .big-choice{grid-template-columns:1fr}
  .top-in{padding:8px 12px}
  .view-pad{padding:14px}
  .hero>.card:first-child{padding:22px!important}
  .hero h1{font-size:31px}
}
@media (prefers-reduced-motion:reduce){
  .bay.on .led,.bay.alarm .led{animation:none}
  .btn,.chip,.nav a,.role .card,.big-choice button,.field input,.field select,.ph-tabs button svg{transition:none}
  .btn:active,.role:active .card{transform:none}
}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};

function rHome(room){
  const mine=S.parcels.filter(p=>p.room===room);
  const ready=mine.filter(p=>p.status==='stored');
  const waiting=mine.filter(p=>p.status==='awaiting');
  const done=mine.filter(p=>p.status==='collected').slice(-3).reverse();
  const bal=S.wallets[room]||0, pc=pendingCod(room);

  let h='';
  if(ready.length)h+=`<div class="ready"><div class="grow"><div style="font-size:12px;opacity:.85">Ready for pickup</div><div style="font-size:20px;font-weight:800">${ready.length} parcel${ready.length>1?'s':''}</div></div><button class="btn sm" data-act="rtab" data-k="pickup">Show QR</button></div>`;
  else h+=`<div class="pcard muted">No parcels waiting in the parcel room.</div>`;
  if(pc>bal)h+=`<div class="msg warn" style="margin-top:10px">COD due on delivery ${baht(pc)}, wallet ${baht(bal)}. Top up or the courier can't drop it off. <button class="btn sm" data-act="rtab" data-k="wallet">Top up</button></div>`;
  if(ready.length){h+=`<div class="ph-sec">In the parcel room</div>`+ready.map(p=>{const f=overtimeFee(p);return `<div class="pcard"><div class="row"><span class="t grow">${esc(p.carrier)}</span><span class="badge pri" data-bay="${p.bay}">Bay ${p.bay}</span></div>
    <div class="small muted mono">${last4(p.tracking)}</div><div class="small muted">${esc(p.size)} · ${g(p.weight)} · stored ${fmtDT(p.storedAt)}</div>
    <div class="row" style="margin-top:4px;flex-wrap:wrap">${p.cod?`<span class="badge ok">COD ${baht(p.cod)} paid</span>`:''}${f?`<span class="badge bad">Overtime fee ${baht(f)}</span>`:`<span class="badge">Free storage: ${Math.max(0,FREE_DAYS-storageDays(p))} day(s) left</span>`}</div></div>`;}).join('');}
  h+=`<div class="ph-sec">Registered, not delivered yet</div>`;
  h+=waiting.length?waiting.map(p=>`<div class="pcard"><div class="row"><span class="t grow">${esc(p.carrier)}</span>${p.cod?`<span class="badge cod">COD ${baht(p.cod)}</span>`:''}</div><div class="small muted mono">${last4(p.tracking)}</div></div>`).join(''):`<div class="small muted">Nothing registered. Add your tracking code after you order.</div>`;
  if(done.length)h+=`<div class="ph-sec">Recently collected</div>`+done.map(p=>`<div class="pcard small"><span class="t">${esc(p.carrier)}</span> <span class="mono muted">${last4(p.tracking)}</span><div class="muted">Collected ${fmtDT(p.collectedAt)}</div></div>`).join('');
  if(notifs.length)h+=`<div class="ph-sec">Notifications</div>`+notifs.map(n=>`<div class="notif ${n.kind}"><div class="muted" style="font-size:11px">${fmtT(n.t)}</div>${esc(n.msg)}</div>`).join('');
  return h;
}
function rRegister(room){

/* ================= DOOR ================= */
function doorView(){
  const d=S.door;
  const locked=!(d.mode==='courier'&&d.unlocked)&&!(d.mode==='pickup'&&d.step==='collect');
  let main='';
  if(S.door.lockAlert){
    const a=S.alerts.find(x=>x.id===S.door.lockAlert);
    main=`<h2 style="color:#fca5a5">Room locked</h2><div class="dmsg bad">${esc(a?a.msg:'Weight mismatch')}</div>
      <p class="muted">The juristic office has been notified and must check the room before the door opens again.</p>
      <div class="demo-note"><b>Demo</b> Open the <a href="#office" style="color:#5eead4">Juristic office</a> view and resolve the alert.</div>`;
  }
  else if(d.mode==='idle')main=dIdle();
  else if(d.mode==='courier')main=dCourier();
  else if(d.mode==='pickup')main=dPickup();
  const lit=litBays();
  return `<div class="door">
    <div class="door-bar">${I.door}<b>ParceLock door · Parcel room 1</b><span class="grow"></span>
      <span class="lock ${S.door.lockAlert||locked?'locked':'open'}">${S.door.lockAlert?'LOCKED · ALERT':locked?'LOCKED':'UNLOCKED'}</span></div>
    <div class="door-grid"><div class="door-main">${main}</div>
    <div class="door-side"><div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Bays</b><span class="small muted">LED guide · bay scales</span></div>
      <div class="bays">${BAYS.map(b=>{const it=storedIn(b);const w=it.reduce((a,p)=>a+p.weight,0);
        return `<div class="bay ${lit.alarm.includes(b)?'alarm':lit.on.includes(b)?'on':''}" data-bay="${b}"><div class="led"></div><div class="row"><span class="nm grow">${b}</span><span class="small muted">${it.length} item${it.length===1?'':'s'}</span></div><div class="ld mono">scale ${g(w)}</div></div>`;}).join('')}</div>
      ${entranceScale()}
    </div></div></div>`;
}
function litBays(){
  const d=S.door,on=[],alarm=[];
  if(d.mode==='courier'&&d.step==='place'&&d.current)on.push(d.current.bay);
  if(d.mode==='pickup'&&d.step==='collect'){
    if(d.mismatch){alarm.push(d.mismatch.bay);}
    else d.items.filter(id=>!d.taken.includes(id)).forEach(id=>{const p=P(id);if(p)on.push(p.bay);});
  }
  if(S.door.lockAlert){const a=S.alerts.find(x=>x.id===S.door.lockAlert);if(a&&a.bay)alarm.push(a.bay);}
  return {on,alarm};
}
function entranceScale(){
  const d=S.door;let w=null;
  if(d.mode==='courier'&&d.current)w=d.current.w;
  return `<div class="bay" style="margin-top:10px"><div class="row"><span class="grow"><b>Entrance scale</b></span><span class="mono">${w?g(w):'0 g'}</span></div><div class="ld">Courier weighs each parcel here before entering</div></div>`;
}
function dIdle(){
  return `<h2>Welcome</h2><p class="muted">Couriers scan a registered parcel. Residents show their pickup QR.</p>
    <div class="big-choice">
      <button data-act="dStart" data-m="courier">${I.truck}<b>Courier drop-off</b><span class="muted small">Weigh, scan, place, get COD payout</span></button>
      <button data-act="dStart" data-m="pickup">${I.qr}<b>Resident pickup</b><span class="muted small">Scan your one-time QR</span></button>
    </div>${UI.dInfo?`<div class="dmsg ok">${UI.dInfo}</div>`:''}`;
}
function stepper(list,cur){const i=list.indexOf(cur);return `<div class="steps">${list.map((s,k)=>`<span class="${k<i?'done':k===i?'on':''}">${k+1}. ${s}</span>`).join('')}</div>`;}
function dCourier(){

      </div><div class="row"><button class="btn pri">Scan &amp; unlock</button>${placed.length?`<button type="button" class="btn" data-act="cFinish">Done, ${placed.length} placed</button>`:`<button type="button" class="btn ghost" data-act="dCancel">Cancel</button>`}</div></form>
      <div class="demo-note"><b>Demo</b> Tap a label to simulate scanning it and weighing the parcel:<div style="margin-top:8px">
        ${waiting.map(p=>`<button class="chip mono" data-act="cFill" data-id="${p.id}">${esc(p.tracking)} · ${p.room}${p.cod?' · COD':''}</button>`).join('')}
        <button class="chip" data-act="cFillUnreg">Unregistered parcel</button></div></div>`;
  }
  else if(d.step==='place'){
    const p=P(d.current.id);
    h+=`<div class="row" style="gap:22px;align-items:center"><div class="bigbay" data-bay="${d.current.bay}">${d.current.bay}</div><div><h2>Place it in Bay ${d.current.bay}</h2>
      <div class="muted">Follow the lit LED strip. Room ${esc(p.room)} · <span class="mono">${last4(p.tracking)}</span> · ${g(d.current.w)}${p.cod?` · COD ${baht(p.cod)}`:''}</div></div></div>
      <p class="muted" style="margin-top:18px">The bay scale confirms the parcel once it's on the shelf.</p>

      <div class="demo-note"><b>Demo</b> <button class="link" data-act="cWrongBay">Place it in the wrong bay</button> to see the weight check lock the room.</div>`;
  }
  else if(d.step==='next'){
    const last=placed[placed.length-1];
    h+=`<div class="dmsg ok">Bay ${esc(last.bay)} confirmed +${g(last.weight)}. Room ${esc(last.room)} has been notified.</div>
      <h2>Anything else to drop off?</h2><p class="muted">One courier at a time, with as many parcels as you need in one visit.</p>

  }

      ${cods.map(p=>`<div class="ditem"><div class="bl">${p.bay}</div><div class="grow">Room ${esc(p.room)} · <span class="mono">${last4(p.tracking)}</span></div><b>${baht(p.cod)}</b></div>`).join('')}
      <button class="btn pri lg" data-act="cPayout">Scan payout QR</button>

  }
  else if(d.step==='pod'){
    const pod=S.pods[S.pods.length-1];
    h+=`<h2>Delivery complete</h2><p class="muted">Door locked. This proof of delivery has been sent to the carrier app.</p>
      <div class="pod"><div class="row"><b class="grow">Proof of Delivery</b><span class="mono small">${esc(pod.id)}</span></div>
      <div class="small muted">${fmtDT(pod.t)} · ParceLock parcel room 1 · ${esc(pod.courier)}</div>
      <table><tr><th>Tracking</th><th>Room</th><th>Bay</th><th>Weight</th><th>COD</th></tr>
      ${pod.items.map(i=>`<tr><td class="mono">${esc(i.tracking)}</td><td>${esc(i.room)}</td><td>${i.bay}</td><td>${g(i.weight)}</td><td>${i.cod?baht(i.cod)+' paid':'-'}</td></tr>`).join('')}</table>
      ${pod.cod?`<div style="margin-top:8px"><b>COD paid to courier: ${baht(pod.cod)}</b></div>`:''}</div>

}
function placedList(items){return items.map(p=>`<div class="ditem"><div class="bl on">${p.bay}</div><div class="grow">Room ${esc(p.room)} · <span class="mono">${last4(p.tracking)}</span><div class="small muted">${g(p.weight)}${p.cod?` · COD ${baht(p.cod)}`:''}</div></div><span class="badge ok">placed</span></div>`).join('');}

function dPickup(){

    h+=`<h2>Show your pickup QR</h2><p class="muted">Hold your phone up to the scanner, or type the 6-digit code.</p>

      <form data-form="pscan"><div class="row" style="align-items:flex-end"><div class="field grow"><label>Pickup code</label><input id="p-code" class="mono" inputmode="numeric" maxlength="7" placeholder="000 000" autocomplete="off" required></div></div>

    if(d.mismatch){const m=d.mismatch;h+=`<div class="dmsg bad"><b>That's not your parcel.</b> Bay ${m.bay} lost ${g(m.grams)}, but we expected ${g(m.expected)} from Bay ${m.expBay}. Please put it back. The juristic office has been notified.</div>
      <button class="btn danger" data-act="pReturn">I've put it back</button>`;}
    h+=`<div style="margin-top:12px">${items.map(p=>{const t=d.taken.includes(p.id);return `<div class="ditem ${t?'done':''}"><div class="bl ${t?'':'on'}" data-bay="${p.bay}">${p.bay}</div>
      <div class="grow">${esc(p.carrier)} · <span class="mono">${last4(p.tracking)}</span><div class="small muted">${esc(p.size)} · ${g(p.weight)}${p.cod?' · COD paid':''}${overtimeFee(p)?` · <span style="color:#fca5a5">overtime fee ${baht(overtimeFee(p))}</span>`:''}</div></div>
      ${t?'<span class="badge ok">✓ weight matched</span>':`<div style="text-align:right"><button class="btn sm pri" data-act="pTake" data-id="${p.id}" ${d.mismatch?'disabled':''}>Take from Bay ${p.bay}</button><br><button class="link" data-act="pWrong" data-id="${p.id}" ${d.mismatch?'disabled':''}>Demo: take the wrong box</button></div>`}</div>`;}).join('')}</div>

}

function alertCard(a){

  return `<div class="alert ${a.resolved?'res':info?'info':''}"><div class="row"><b class="grow">${label}</b><span class="small muted mono">${fmtT(a.t)}</span></div>

}

function commit(){save();render();}
function resetDoorMsgs(){UI.dErr=null;UI.dInfo=null;}
const A={
  rtab(ds){UI.rtab=ds.k;UI.regMsg=null;UI.walletMsg=null;render();},
  topup(ds){const a=+ds.a;S.wallets[UI.room]=(S.wallets[UI.room]||0)+a;S.tx.push({t:Date.now(),room:UI.room,amount:a,desc:'Top-up'});
    log('Room '+UI.room,'wallet_topup',baht(a));UI.walletMsg=`Added ${baht(a)} to your wallet.`;commit();},
  phoneScan(){const pass=S.passes[UI.room];if(!pass)return;
    if(S.door.mode!=='idle'&&!(S.door.mode==='pickup'&&S.door.step==='scan')){toast('The door is busy with another user. Finish or cancel it first.');return;}
    resetDoorMsgs();pickupUnlock(pass.code);if(UI.view==='resident')toast('Door unlocked. Open the Door panel or Side-by-side view.');},
  dStart(ds){resetDoorMsgs();if(ds.m==='courier')S.door={mode:'courier',step:'scan',items:[],current:null,unlocked:false,startedAt:Date.now(),courier:'Courier #'+rnd(100,999)};
    else S.door={mode:'pickup',step:'scan',items:[],taken:[],startedAt:Date.now()};
    log(ds.m==='courier'?S.door.courier:'resident',ds.m==='courier'?'courier_session_start':'pickup_session_start','At door');commit();},
  dCancel(){const m=S.door.mode;S.door={mode:'idle'};resetDoorMsgs();log('door',m+'_cancelled','');commit();},
  dDone(){S.door={mode:'idle'};resetDoorMsgs();commit();},
  cFill(ds){const p=P(ds.id);$('#c-track').value=p.tracking;$('#c-w').value=p.weight+rnd(-8,8);},
  cFillUnreg(){$('#c-track').value='FLA'+rnd(100000000,999999999);$('#c-w').value=rnd(300,2500);},
  cPlace(){const d=S.door,c=d.current,p=P(c.id);
    p.status='stored';p.bay=c.bay;p.weight=c.w;p.storedAt=now();ensurePass(p.room);
    d.items.push({id:p.id});d.current=null;d.step='next';
    log(d.courier,'parcel_stored',`${p.tracking} → Room ${p.room}, Bay ${p.bay}, ${g(p.weight)} (bay scale matched)`);
    notify(p.room,`Your ${p.carrier} parcel …${p.tracking.slice(-4)} has arrived in Bay ${p.bay}. Show your pickup QR at the door.`);
    if(p.cod){S.wallets[p.room]-=p.cod;p.codPaid=true;S.tx.push({t:Date.now(),room:p.room,amount:-p.cod,desc:`COD …${p.tracking.slice(-4)} (${p.carrier})`});
      notify(p.room,`COD ${baht(p.cod)} for …${p.tracking.slice(-4)} was paid from your wallet.`);log('system','cod_charged',`Room ${p.room} wallet −${baht(p.cod)}`);}
    commit();},
  cWrongBay(){const d=S.door,c=d.current,p=P(c.id);const wrong=BAYS.filter(b=>b!==c.bay)[rnd(0,2)];
    const a=alertOffice('dropoff_mismatch',`Courier placed …${p.tracking.slice(-4)} (Room ${p.room}, ${g(c.w)}) in Bay ${wrong} instead of Bay ${c.bay}. Bay ${c.bay} scale: +0 g, Bay ${wrong} scale: +${g(c.w)}.`,{bay:wrong,parcelId:p.id,expBay:c.bay,w:c.w});
    S.door.lockAlert=a.id;log(d.courier,'dropoff_mismatch',`${p.tracking} expected Bay ${c.bay}, detected Bay ${wrong}. Room locked`);commit();},
  cAnother(){resetDoorMsgs();S.door.step='scan';commit();},
  cFinish(){const d=S.door;const placed=d.items.map(x=>P(x.id));if(!placed.length){S.door={mode:'idle'};commit();return;}
    d.unlocked=false;d.step=placed.some(p=>p.cod)?'cod':'pod';if(d.step==='pod')issuePod();commit();},
  cPayout(){const d=S.door;const placed=d.items.map(x=>P(x.id));const tot=placed.reduce((a,p)=>a+(p.cod||0),0);
    log(d.courier,'cod_payout',`${baht(tot)} paid to courier at payment unit`);d.step='pod';issuePod();commit();},
  pFill(ds){$('#p-code').value=S.passes[ds.r].code;},
  pFillBad(){$('#p-code').value=String(rnd(100000,999999));},
  pTake(ds){const d=S.door,p=P(ds.id);removal(p,{bay:p.bay,grams:p.weight+rnd(-6,6)});},
  pWrong(ds){const d=S.door,p=P(ds.id);
    let others=S.parcels.filter(x=>x.status==='stored'&&x.room!==d.room);
    const same=others.filter(x=>x.bay===p.bay);const o=(same.length?same:others)[0];
    const ev=o?{bay:o.bay,grams:o.weight,other:o.id}:{bay:p.bay,grams:p.weight+700,other:null};
    removal(p,ev);},
  pReturn(){const d=S.door;log('Room '+d.room,'item_returned',`Item put back in Bay ${d.mismatch.bay}; scale back to normal`);d.mismatch=null;commit();},
  pFinish(ds){const d=S.door;const items=d.items.map(P);const took=items.filter(p=>d.taken.includes(p.id));
    took.forEach(p=>{const f=overtimeFee(p);
      if(f){S.wallets[d.room]=(S.wallets[d.room]||0)-f;S.tx.push({t:Date.now(),room:d.room,amount:-f,desc:`Overtime storage fee …${p.tracking.slice(-4)}`});log('system','overtime_fee',`Room ${d.room} −${baht(f)} for ${p.tracking} (${storageDays(p)} days stored)`);}
      p.status='collected';p.collectedAt=now();p.bay=null;});
    const secs=Math.round((Date.now()-d.startedAt)/1000);
    log('Room '+d.room,'pickup_complete',`${took.length} parcel(s) collected in ${secs}s${ds.partial?`, ${items.length-took.length} left for later`:''}`);
    if(!S.parcels.some(p=>p.room===d.room&&p.status==='stored'))delete S.passes[d.room];
    else S.passes[d.room]={code:newCode(),createdAt:Date.now()};
    notify(d.room,`You collected ${took.length} parcel${took.length>1?'s':''}. Your pickup QR has been used.`);
    UI.dInfo=`Room ${esc(d.room)}: ${took.length} parcel${took.length>1?'s':''} collected. Door locked.`;S.door={mode:'idle'};commit();},
  resolve(ds){const a=S.alerts.find(x=>x.id===ds.id);if(!a)return;a.resolved=true;a.resolvedAt=Date.now();
    if(a.type==='dropoff_mismatch'){const p=P(a.parcelId);const d=S.door;
      a.note=`Officer moved parcel to Bay ${a.expBay}`;
      if(d.mode==='courier'&&d.current&&d.current.id===a.parcelId){S.door.lockAlert=null;log('Officer','alert_resolved',a.note+'; door unlocked');A.cPlace();return;}
      S.door.lockAlert=null;}
    else a.note='Checked by officer';
    log('Officer','alert_resolved',a.note);commit();},
  dayPlus(){S.dayOffset++;log('demo','clock_advanced',`+${S.dayOffset} day(s)`);commit();},
  resetAsk(){UI.confirmReset=true;render();},
  resetNo(){UI.confirmReset=false;render();},
  reset(){S=seed();UI.confirmReset=false;resetDoorMsgs();UI.regMsg=null;UI.walletMsg=null;commit();toast('Demo data reset');},
  csvCopy(){const c=csv();try{navigator.clipboard.writeText(c).then(()=>toast('CSV copied'),()=>toast('Copy blocked by the browser'));}catch(e){toast('Copy blocked by the browser');}},
  csvDl(){try{const b=new Blob([csv()],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='parcelock-log.csv';document.body.appendChild(a);a.click();a.remove();toast('Download started (use Copy CSV if nothing happens)');}catch(e){toast('Download blocked; use Copy CSV');}},
};
function csv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';return ['time_iso,actor,event,detail'].concat(S.log.map(l=>[new Date(l.t).toISOString(),l.actor,l.event,l.detail].map(q).join(','))).join('\n');}
function issuePod(){const d=S.door;const placed=d.items.map(x=>P(x.id));
  const pod={id:'POD-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+rnd(1000,9999),t:Date.now(),courier:d.courier,
    items:placed.map(p=>({tracking:p.tracking,room:p.room,bay:p.bay,weight:p.weight,cod:p.cod})),cod:placed.reduce((a,p)=>a+(p.cod||0),0)};
  S.pods.push(pod);const secs=Math.round((Date.now()-d.startedAt)/1000);
  log(d.courier,'delivery_complete',`${pod.id}: ${placed.length} parcel(s) in ${secs}s, door locked`);}
function removal(p,ev){
  const d=S.door,t=tol(p.weight);
  const ok=ev.bay===p.bay&&Math.abs(ev.grams-p.weight)<=t;
  if(ok){d.taken.push(p.id);log('Room '+d.room,'parcel_taken',`${p.tracking} from Bay ${p.bay}: −${g(ev.grams)} (expected ${g(p.weight)} ±${t} g) ✓`);}
  else{d.mismatch={bay:ev.bay,grams:ev.grams,expected:p.weight,expBay:p.bay};
    const o=ev.other?P(ev.other):null;
    alertOffice('pickup_mismatch',`Room ${d.room} removed ${g(ev.grams)} from Bay ${ev.bay}; expected ${g(p.weight)} from Bay ${p.bay}${o?` (looks like Room ${o.room}'s parcel …${o.tracking.slice(-4)})`:''}. Resident asked to return it.`,{bay:ev.bay});
    log('Room '+d.room,'pickup_mismatch',`Bay ${ev.bay} −${g(ev.grams)}, expected Bay ${p.bay} −${g(p.weight)}`);}
  commit();
}
function pickupUnlock(code){
  const room=roomByCode(code);
  const items=room?S.parcels.filter(p=>p.room===room&&p.status==='stored'):[];
  if(!room||!items.length){UI.dErr='This code is not valid or has already been used. Door stays locked.';
    if(S.door.mode!=='pickup')S.door={mode:'pickup',step:'scan',items:[],taken:[],startedAt:Date.now()};
    log('door','pickup_rejected',`Invalid code ${code}`);commit();return;}
  if(S.door.mode!=='pickup')S.door={mode:'pickup',step:'scan',items:[],taken:[],startedAt:Date.now()};
  Object.assign(S.door,{step:'collect',room,items:items.map(p=>p.id),taken:[],mismatch:null});
  UI.dErr=null;log('Room '+room,'pickup_unlocked',`QR accepted, ${items.length} parcel(s) in Bay ${[...new Set(items.map(p=>p.bay))].sort().join(', ')}`);commit();
}
const FORMS={
  register(){
    const tr=$('#r-track').value.trim().toUpperCase(),car=$('#r-carrier').value,size=$('#r-size').value,cod=$('#r-cod').checked,amt=Math.round(+$('#r-codamt').value||0);
    if(!/^[A-Z0-9]{8,20}$/.test(tr)){UI.regMsg={k:'bad',html:'Tracking code should be 8–20 letters or numbers.'};render();return;}
    if(S.parcels.some(p=>p.tracking===tr)){UI.regMsg={k:'bad',html:'This tracking code is already registered.'};render();return;}
    if(cod&&amt<=0){UI.regMsg={k:'bad',html:'Enter the COD amount.'};render();return;}
    const [a,b]=SIZES[size];
    S.parcels.push({id:'p'+(S.seq++),tracking:tr,carrier:car,room:UI.room,size,weight:rnd(a,b),cod:cod?amt:0,codPaid:false,status:'awaiting',bay:null,registeredAt:now(),storedAt:null,collectedAt:null});
    log('Room '+UI.room,'parcel_registered',`${tr} (${car})${cod?`, COD ${baht(amt)}`:''}`);
    const bal=S.wallets[UI.room]||0,pc=pendingCod(UI.room);
    UI.regMsg=cod&&pc>bal?{k:'warn',html:`Registered. Your wallet (${baht(bal)}) doesn't cover the COD due (${baht(pc)}). Top up before it arrives.`}:{k:'ok',html:`Registered <span class="mono">${esc(tr)}</span>. We'll notify you when it's in the parcel room.`};
    commit();},
  cscan(){
    const tr=$('#c-track').value.trim().toUpperCase(),w=Math.round(+$('#c-w').value||0),d=S.door;
    if(w<=0){UI.dErr='Put the parcel on the entrance scale first.';render();return;}
    const p=S.parcels.find(x=>x.tracking===tr);
    if(!p){UI.dErr=`<b>${esc(tr)}</b> is not registered with any room. The door stays locked. Please contact the juristic office or return the parcel to the hub.`;
      alertOffice('unregistered',`Courier tried to deliver unregistered parcel ${tr} (${g(w)}). Door kept locked.`);log(d.courier,'rejected_unregistered',tr);commit();return;}
    if(p.status!=='awaiting'||d.items.some(x=>x.id===p.id)){UI.dErr=`<b>${esc(tr)}</b> has already been delivered.`;render();return;}
    if(p.cod){const bal=S.wallets[p.room]||0; // earlier COD parcels in this visit were already charged at placement
      if(bal<p.cod){UI.dErr=`COD ${baht(p.cod)} for Room ${esc(p.room)} is not covered (wallet ${baht(bal)}). The door stays locked and the resident has been asked to top up.`;
        notify(p.room,`A courier tried to deliver COD parcel …${p.tracking.slice(-4)} (${baht(p.cod)}) but your wallet has ${baht(bal)}. Top up so it can be delivered.`,'warn');
        alertOffice('cod_balance',`COD parcel ${p.tracking} for Room ${p.room} (${baht(p.cod)}) refused: wallet ${baht(bal)}.`);
        log(d.courier,'rejected_cod_balance',`${p.tracking} Room ${p.room} needs ${baht(p.cod)}, wallet ${baht(bal)}`);commit();return;}}
    const bay=assignBay(w,[]);
    d.current={id:p.id,bay,w};d.step='place';d.unlocked=true;UI.dErr=null;
    log(d.courier,'label_scanned',`${tr} (Room ${p.room}, ${g(w)}) accepted, door unlocked, assigned Bay ${bay}`);commit();},
  pscan(){const code=$('#p-code').value.replace(/\D/g,'');pickupUnlock(code);},
};
